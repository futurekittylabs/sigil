name: Sigil-macOS
options:
  xcodeVersion: "26.6"
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  Sigil:
    type: application
    platform: macOS
    sources:
      - Sigil
      - path: ../../images/Sigil.icon
        type: file
        buildPhase: resources
    settings:
      base:
        DEAD_CODE_STRIPPING: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.sigil.macos
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sigil
        ASSETCATALOG_COMPILER_APPICON_NAME: Sigil
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
schemes:
  Sigil-macOS:
    build:
      targets:
        Sigil: all
    run:
      config: Debug
