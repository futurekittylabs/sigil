name: Sigil
options:
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  Sigil:
    type: application
    platform: macOS
    sources:
      - Sigil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sigil.macos
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sigil
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
    scheme: {}
